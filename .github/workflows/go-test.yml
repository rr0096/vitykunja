name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        # Use a recent Go release to satisfy modules that require Go >= 1.21
        go-version: '1.25'

    - name: Prepare frontend files
      run: |
        mkdir -p frontend/dist
        touch frontend/dist/index.html

    - name: Run go test
      run: |
        go test ./... -v

    - name: Build
      run: |
        go build ./...
